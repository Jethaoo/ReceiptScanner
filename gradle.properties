# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Set Java home to Java 17+ if Gradle picks an older JDK (uncomment and fix path):
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-17
# When configured, Gradle will run in incubating parallel mode.
# org.gradle.parallel=true

# AndroidX package structure
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Each library's R class only includes its own resources (smaller R.java/Kotlin)
android.nonTransitiveRClass=true

android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# Legacy `android { }` block in app/build.gradle.kts — keep until migrated to AGP "new DSL".
# AGP 10 will remove this flag.
android.newDsl=false

# Use standalone Kotlin Gradle plugin (required with org.jetbrains.kotlin.android + KSP today).
# AGP 10 will remove this flag; migrate when AGP documents the replacement workflow.
android.builtInKotlin=false

# Suppress noisy sync hint when library constraints are enabled (see AGP release notes)
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
